<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml">
<head>
<meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
<title>Registration From</title>
<style>
    body {
        font-family: Arial, Helvetica, sans-serif;
        background-color: #f2f2f2;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
    }

    .form-container {
        background-color: #fff;
        padding: 25px 35px;
        border-radius: 10px;
        box-shadow: 0 0 10px rgba(0,0,0,0.2);
        width: 380px;
    }
    h2 {
        text-align: center;
        color: green;
        margin-bottom: 20px;
    }
    label {
        font-weight: bold;
        text-transform: capitalize;
        display: block;
        margin-top: 10px;
        color:#333;
    }
    input {
        width: 100%;
        padding: 8px;
        margin-top: 5px;
        border: 1px solid #ccc;
        border-radius: 5px;
        transition: all 0.3s ease-in-out;
    }
    
    input:focus {
        border-color: green;
        box-shadow: 0 0 8px rgba(0, 128, 0, 0.2);
    }
    input[type="range"] {
        width: 100%;
		accent-color:red;
        margin-top: 15px;
    }
	.buttons {
		width:100%;
		display:flex;
		justify-content:space-between;
	}
    input[type="submit"],
    input[type="reset"] {
        width: 45%;
        background-color: green;
        color: azure;
        border: none;
        padding: 8px;
        border-radius: 5px;
        cursor: pointer;
        font-weight: bold;
        transition: all 0.3s ease-in-out;
    }
    input[type="submit"]:hover,
    input[type="reset"]:hover {
        background-color: #28a745;
        transform: scale(1.05);
    }
</style>
</head>
    <div class="form-container">
        <h2>Registration Form</h2>
        <form onsubmit="alert('Submitted'); return false;">
            <label for="name">name</label>
            <input type="text" id="name" placeholder="Enter your name">
            <label for="password">password</label>
            <input type="password" id="password" placeholder="Enter your password">
            <label for="confirm">confirm password</label>
            <input type="password" id="confirm" placeholder="Confirm password">
            <label for="contact">contact number</label>
            <input type="tel" id="contact" placeholder="Enter your contact number" pattern="[0-9]{10}" maxlength="10">
            <label for="skill">skill range</label>
            <input type="range" id="skill" >
            <label for="email">Email</label>
            <input type="email" id="email" placeholder="Enter your email">
            <label for="url">profile URL</label>
            <input type="url" id="url" placeholder="Enter a url">
            <label for="file">Resume</label>
            <input type="file" id="file">

            <div class="buttons">
                <input type="submit" value="Submit">
                <input type="reset" value="Reset">
            </div>
        </form>
    </div>
<body>
</body>
</html>
